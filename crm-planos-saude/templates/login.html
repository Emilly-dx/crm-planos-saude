<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Plano de Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='Plano.css') }}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-[#6aa54c] to-emerald-600">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md mx-4 p-10">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-[#6aa54c] rounded-2xl flex items-center justify-center text-white text-4xl">🩺</div>
            </div>
            <h1 class="text-3xl font-bold text-center text-[#6aa54c] mb-1">Plano de Saúde</h1>
            <p class="text-center text-[#6aa54c] mb-8">CRM Corretor Autônomo</p>

            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Usuário (e-mail)</label>
                    <input type="email" id="usuario" required 
                           class="w-full border border-gray-300 rounded-3xl px-6 py-4 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Senha</label>
                    <input type="password" id="senha" required 
                           class="w-full border border-gray-300 rounded-3xl px-6 py-4 focus:outline-none focus:border-emerald-500">
                    <div class="flex items-center gap-2 mt-2">
                        <input type="checkbox" onclick="this.previousElementSibling.type = this.checked ? 'text' : 'password'">
                        <span class="text-gray-600 text-sm">Mostrar senha</span>
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="lembrar" class="accent-sky-600">
                        <span class="text-gray-600">Lembrar-me</span>
                    </label>
                    <a href="#" class="text-sky-600 hover:underline">Esqueci a senha</a>
                </div>

                <button onclick="fazerLogin(event)" 
                        class="block w-full text-center bg-[#6aa54c] hover:bg-emerald-700 text-white font-semibold py-4 rounded-3xl cursor-pointer">
                    Entrar
                </button>
            </form>
            <p class="text-center text-xs text-gray-500 mt-8">Demo estática • Backend receberá POST em /login</p>
        </div>
    </div>

    <script>
        function fazerLogin(e) {
            e.preventDefault();
            localStorage.setItem('logado', 'true');
            window.location.href = '/';
        }

        if (localStorage.getItem('logado') === 'true') {
            window.location.href = '/';
        }
    </script>

</body>
</html>
